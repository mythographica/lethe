[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemonica-lethe"
version = "0.1.0"
description = "The cross-language mnemonica lineage contract: the lineage schema and the shared fixture, importable from Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = ["mnemonica_lethe"]

[tool.setuptools.package-data]
mnemonica_lethe = ["*.json", "data/*.json", "py.typed"]
